services:
  bead-code:
    build: .
    container_name: bead-code
    restart: unless-stopped
    ports:
      # 部署机可在 .env 中覆盖端口，避免与同机已有服务冲突。
      - "127.0.0.1:${BEAD_CODE_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
